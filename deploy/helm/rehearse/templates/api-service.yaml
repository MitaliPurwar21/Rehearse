apiVersion: v1
kind: Service
metadata:
  name: {{ include "rehearse.fullname" . }}-api
  labels:
    {{- include "rehearse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000

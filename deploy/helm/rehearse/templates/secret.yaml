apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rehearse.fullname" . }}-secret
  labels:
    {{- include "rehearse.labels" . | nindent 4 }}
type: Opaque
# stringData so you can read what you set. Values come from --set-string at install time,
# never from a committed file. Only emit a key when it has a value, so an unset DATABASE_URL
# lets the app fall back to its SQLite default instead of getting an empty string.
stringData:
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- $db := include "rehearse.databaseUrl" . }}
  {{- if $db }}
  DATABASE_URL: {{ $db | quote }}
  {{- end }}

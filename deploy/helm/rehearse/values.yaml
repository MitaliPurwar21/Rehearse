image:
  repository: ghcr.io/mitalipurwar21/rehearse
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  service:
    port: 80
  ingress:
    enabled: false
    className: ""
    host: rehearse.local
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

operator:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}

# Non-secret config. Ends up in a ConfigMap.
config:
  judgeProvider: claude
  corsOrigins: "http://localhost:3000"

# Secrets. Pass these at install time (--set-string), never commit them. Leaving the
# key blank is fine for a kind demo where the eval Job runs offline.
secrets:
  anthropicApiKey: ""
  databaseUrl: ""   # only used when postgres.enabled is false (e.g. a Neon URL)

# In-cluster Postgres for a self-contained demo. Turn it off to point at managed
# Postgres (Neon) via secrets.databaseUrl instead.
postgres:
  enabled: true
  image: postgres:16-alpine
  db: rehearse
  user: rehearse
  password: rehearse   # demo only, override for anything real
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evalruns.rehearse.dev
spec:
  group: rehearse.dev
  scope: Namespaced
  names:
    kind: EvalRun
    plural: evalruns
    singular: evalrun
    shortNames: [er]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mode:
                  type: string
                  enum: [regression]
                  default: regression
                note:
                  type: string
            status:
              type: object
              # The operator fills these in; let the API server accept whatever it writes.
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: QWK
          type: string
          jsonPath: .status.qwk
        - name: Pairs
          type: string
          jsonPath: .status.nPairs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
